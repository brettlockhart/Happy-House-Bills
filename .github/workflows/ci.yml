name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
      paths-ignore:
        - 'docs/**/*.md'
        - '*.md'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vue-tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run docs:lint
      - run: npm run docs:audit

  deploy-convex:
    name: Deploy Convex
    permissions:
      contents: read
      deployments: write
    needs: [lint, typecheck, test, docs]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  deploy-nuxt:
    name: Deploy Nuxt
    permissions:
      contents: read
      deployments: write
    needs: deploy-convex
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_UPGRADE_PRICE_ID: ${{ secrets.STRIPE_UPGRADE_PRICE_ID }}
          STRIPE_LOCAL_MOCK: ${{ secrets.STRIPE_LOCAL_MOCK }}
          NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NUXT_CLERK_SECRET_KEY: ${{ secrets.NUXT_CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          RECEIPT_SIGNED_URL_TTL: ${{ secrets.RECEIPT_SIGNED_URL_TTL }}
          NUXT_PUBLIC_AUTH_BYPASS: ${{ secrets.NUXT_PUBLIC_AUTH_BYPASS }}
          NUXT_PUBLIC_AUTH_BYPASS_USER_ID: ${{ secrets.NUXT_PUBLIC_AUTH_BYPASS_USER_ID }}
          NUXT_PUBLIC_AUTH_BYPASS_ORG_ID: ${{ secrets.NUXT_PUBLIC_AUTH_BYPASS_ORG_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_DOCUMENT_AI_PROCESSOR_ID: ${{ secrets.GOOGLE_DOCUMENT_AI_PROCESSOR_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_OCR_MODEL: ${{ secrets.OPENROUTER_OCR_MODEL }}
          OPENROUTER_ZDR: ${{ secrets.OPENROUTER_ZDR }}

  verify-deploy:
    name: Verify Deployment
    permissions:
      contents: read
      deployments: write
    needs: [deploy-convex, deploy-nuxt]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run deployment verification script
        run: npx tsx scripts/verify-deploy.ts
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
